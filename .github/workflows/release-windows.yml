name: Release Windows

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: 发布前全量校验
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    name: 构建并发布 NSIS 安装包
    needs: validate
    runs-on: windows-2025

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false

      - name: 安装 stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 获取 pnpm 缓存目录
        id: pnpm-store
        shell: pwsh
        run: Add-Content $env:GITHUB_OUTPUT ("path=" + (pnpm store path --silent))

      - name: 缓存构建依赖
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: ${{ runner.os }}-chatvault-release-${{ hashFiles('pnpm-lock.yaml', 'Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-chatvault-release-
            ${{ runner.os }}-chatvault-

      - name: 构建 Windows 安装包
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release_windows.ps1 -Tag "${{ github.ref_name }}"

      - name: 创建草稿 Release
        id: draft-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw '读取 Cargo 输出目录失败' }
          $installerDirectory = Join-Path $metadata.target_directory 'release/bundle/nsis'
          $installers = @(Get-ChildItem -LiteralPath $installerDirectory -Filter '*-setup.exe' -File)
          if ($installers.Count -eq 0) { throw '未找到 NSIS 安装包' }
          $files = @()
          foreach ($installer in $installers) {
              $checksum = "$($installer.FullName).sha256"
              if (-not (Test-Path -LiteralPath $checksum)) { throw "缺少校验文件：$checksum" }
              $files += $installer.FullName
              $files += $checksum
          }
          # 预发布 tag（如 v0.1.0-alpha.1）在 GitHub 上标为 Pre-release。
          $prereleaseArgs = @()
          if ($tag -match '-') { $prereleaseArgs = @('--prerelease') }
          & gh release create $tag --draft --verify-tag --title "ChatVault $tag" --generate-notes @prereleaseArgs
          if ($LASTEXITCODE -ne 0) { throw '创建草稿 Release 失败' }
          & gh release upload $tag @files --clobber
          if ($LASTEXITCODE -ne 0) { throw '上传 Release 资产失败' }
          & gh release edit $tag --draft=false @prereleaseArgs
          if ($LASTEXITCODE -ne 0) { throw '发布 Release 失败' }
